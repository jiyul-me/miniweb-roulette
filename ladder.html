<body>

    <header class="site-header">
        <div class="header-inner">
            <nav class="tabs" aria-label="추첨 도구 선택">
                <a href="./" class="tab">돌림판</a>
                <a href="ladder.html" class="tab active" aria-current="page">사다리타기</a>
                <a href="lots.html" class="tab">제비뽑기</a>
            </nav>
            <button id="themeToggle" class="theme-toggle" type="button" aria-label="라이트/다크 모드 전환">
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>

            </button>
        </div>
    </header>

    <main class="page">
        <h1 class="page-title">사다리타기</h1>
        <p class="page-subtitle">이름을 클릭하면 사다리를 타고 내려갑니다 — 결과는 끝까지 비밀</p>

        <div class="layout-stack">
            <div id="entryPanel"></div>

            <section class="card" aria-label="사다리타기 게임">
                <div class="tool-controls">
                    <button id="editLabelsBtn" class="btn btn-ghost btn-sm" type="button">결과 수정</button>
                    <div class="spacer"></div>
                    <button id="revealAllBtn" class="btn btn-ghost btn-sm" type="button">모두 공개</button>
                    <button id="rebuildBtn" class="btn btn-primary btn-sm" type="button">다시 만들기</button>
                </div>

                <div class="ladder-scroll">
                    <div class="ladder-inner" id="ladderInner">
                        <div class="ladder-row" id="ladderTop"></div>
                        <canvas id="ladderCanvas"></canvas>
                        <div class="ladder-row" id="ladderBottom"></div>
                    </div>
                </div>
                <div class="ladder-results" id="ladderResults" hidden></div>
                <div class="tool-notice" id="ladderNotice" hidden></div>
                <p class="hint" id="ladderHint"></p>
            </section>

            <div id="historyPanel"></div>
        </div>
    </main>

    <footer class="site-footer">돌림판 · 사다리타기 · 제비뽑기 — roulette.milomiso.com</footer>

    <dialog id="labelsDialog" aria-labelledby="labelsDialogTitle">
        <p class="dialog-label" id="labelsDialogTitle">결과 문구 수정</p>
        <div class="dialog-body" id="labelsInputs"></div>
        <div class="dialog-actions">
            <button id="labelsSaveBtn" class="btn btn-primary" type="button">저장하고 새 사다리 만들기</button>
            <button id="labelsResetBtn" class="btn btn-ghost" type="button">당첨/꽝 기본으로</button>
            <button id="labelsCancelBtn" class="btn btn-ghost" type="button">취소</button>
        </div>
    </dialog>
